services:
  mysql:
    image: mysql:8
    container_name: ride-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ride_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ride-pooling-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ride_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: true
      JWT_SECRET_KEY: mySuperSecretKeyForJwtAuthentication123456

volumes:
  mysql-data: